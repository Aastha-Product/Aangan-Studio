<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" width="760" height="820" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Every call is answered, qualified and routed; no price is ever spoken" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a90"/></marker>
  </defs>
  <rect width="760" height="820" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Every call is answered, qualified and routed; no price is ever spoken</text>
  <text x="24" y="54" font-size="11.5" fill="#5f5f5a">Aangan Studio phone agent · phone calls only. WhatsApp and the web form can plug into Input later.</text>

  <g fill="none" stroke="#9a9a90" stroke-width="1.25">
    <path d="M468 132V156" marker-end="url(#a)"/>
    <path d="M468 212V236" marker-end="url(#a)"/>
    <path d="M468 340V364" marker-end="url(#a)"/>
    <path d="M468 452V476" marker-end="url(#a)"/>
    <path d="M468 580V752"/>
    <path d="M468 648H448" marker-end="url(#a)"/>
    <path d="M468 648H488" marker-end="url(#a)"/>
    <path d="M468 752H448" marker-end="url(#a)"/>
    <path d="M468 752H488" marker-end="url(#a)"/>
  </g>

  <!-- stage labels -->
  <g fill="#efefec" stroke="#9a9a90" stroke-width="1.25">
    <rect x="24" y="76" width="160" height="56" rx="8"/>
    <rect x="24" y="156" width="160" height="56" rx="8"/>
    <rect x="24" y="236" width="160" height="104" rx="8"/>
    <rect x="24" y="364" width="160" height="88" rx="8"/>
    <rect x="24" y="476" width="160" height="104" rx="8"/>
    <rect x="24" y="604" width="160" height="192" rx="8"/>
  </g>
  <g font-weight="600" fill="#1f1f1f" text-anchor="middle">
    <text x="104" y="108">1 · Trigger</text>
    <text x="104" y="188">2 · Input</text>
    <text x="104" y="292">3 · Context</text>
    <text x="104" y="412">4 · Processing</text>
    <text x="104" y="532">5 · AI</text>
    <text x="104" y="704">6 · Output</text>
  </g>

  <!-- stage content -->
  <g fill="none" stroke="#9a9a90" stroke-width="1.25">
    <rect x="200" y="76" width="536" height="56" rx="8"/>
    <rect x="200" y="156" width="536" height="56" rx="8"/>
    <rect x="200" y="236" width="536" height="104" rx="8"/>
    <rect x="200" y="364" width="536" height="88" rx="8"/>
    <rect x="200" y="604" width="248" height="88" rx="8"/>
    <rect x="488" y="604" width="248" height="88" rx="8"/>
    <rect x="200" y="708" width="248" height="88" rx="8"/>
    <rect x="488" y="708" width="248" height="88" rx="8"/>
  </g>
  <rect x="200" y="476" width="536" height="104" rx="8" fill="#e6eefb" stroke="#2f6fd1" stroke-width="2"/>

  <text x="216" y="100" font-weight="600" fill="#1f1f1f">Phone rings — any hour</text>
  <text x="216" y="116" font-size="11.5" fill="#5f5f5a">Studio number forwards to Vaani Labs; the agent answers every call, day or night</text>

  <text x="216" y="180" font-weight="600" fill="#1f1f1f">What the caller says</text>
  <text x="216" y="196" font-size="11.5" fill="#5f5f5a">Live speech turned into a transcript, plus caller number and time of call</text>

  <text x="216" y="260" font-weight="600" fill="#1f1f1f">The helper files</text>
  <text x="216" y="276" font-size="11.5" fill="#5f5f5a">services.md — what Aangan does, service area, 6-week minimum lead time</text>
  <text x="216" y="292" font-size="11.5" fill="#5f5f5a">qualified.md — the five gates and what does not disqualify</text>
  <text x="216" y="308" font-size="11.5" fill="#5f5f5a">pricing.md — only the deflection line; no number ever reaches the caller</text>
  <text x="216" y="324" font-size="11.5" fill="#5f5f5a">Calendly — designers' open consultation slots (Scheduling API)</text>

  <text x="216" y="388" font-weight="600" fill="#1f1f1f">Extract and check</text>
  <text x="216" y="404" font-size="11.5" fill="#5f5f5a">Pull fields: name, area, type, sq ft, rooms, timeline, volunteered budget, owner</text>
  <text x="216" y="420" font-size="11.5" fill="#5f5f5a">Rule checks: area in Pune/PCMC, at least 6 weeks of lead time, type in scope</text>
  <text x="216" y="436" font-size="11.5" fill="#5f5f5a">Speech guard: blocks any price, range or per-sq-ft figure before it is spoken</text>

  <text x="216" y="500" font-weight="600" fill="#1f1f1f">Think and decide</text>
  <text x="216" y="516" font-size="11.5" fill="#1f1f1f">Runs the conversation: one direct question per unclear gate; deflects price</text>
  <text x="216" y="532" font-size="11.5" fill="#1f1f1f">Decides: Qualified P1 / P2 · Nurture · Not qualified + reason code · Escalate</text>
  <text x="216" y="548" font-size="11.5" fill="#1f1f1f">Scores interest out of 100, with a quote from the call behind every point</text>
  <text x="216" y="564" font-size="11.5" fill="#1f1f1f">Claude for the conversation; Gemini Flash for cheap classification and routing</text>

  <text x="216" y="628" font-weight="600" fill="#1f1f1f">Qualified (P1 / P2)</text>
  <text x="216" y="644" font-size="11.5" fill="#5f5f5a">Calendly slot booked on the call</text>
  <text x="216" y="660" font-size="11.5" fill="#5f5f5a">Report card email after webhook</text>
  <text x="216" y="676" font-size="11.5" fill="#5f5f5a">HubSpot deal created</text>

  <text x="504" y="628" font-weight="600" fill="#1f1f1f">Not qualified or Nurture</text>
  <text x="504" y="644" font-size="11.5" fill="#5f5f5a">Polite close, reason code logged</text>
  <text x="504" y="660" font-size="11.5" fill="#5f5f5a">7pm digest email to designers</text>
  <text x="504" y="676" font-size="11.5" fill="#5f5f5a">Nurture: follow up in 4–6 weeks</text>

  <text x="216" y="732" font-weight="600" fill="#1f1f1f">Escalate to a human</text>
  <text x="216" y="748" font-size="11.5" fill="#5f5f5a">Existing client or complaint</text>
  <text x="216" y="764" font-size="11.5" fill="#5f5f5a">Instant alert to studio head</text>
  <text x="216" y="780" font-size="11.5" fill="#5f5f5a">Agent promises a senior callback</text>

  <text x="504" y="732" font-weight="600" fill="#1f1f1f">Every call</text>
  <text x="504" y="748" font-size="11.5" fill="#5f5f5a">Logged to Supabase</text>
  <text x="504" y="764" font-size="11.5" fill="#5f5f5a">Feeds Nikhil's dashboard</text>
  <text x="504" y="780" font-size="11.5" fill="#5f5f5a">Cost per call recorded</text>
</svg>
