<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="After a slot is booked, Calendly's webhook drives everything else" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a90"/></marker>
  </defs>
  <rect width="760" height="580" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">After a slot is booked, Calendly's webhook drives everything else</text>
  <text x="24" y="54" font-size="11.5" fill="#5f5f5a">Calendly Scheduling API (paid plan) + webhooks (Standard plan or higher)</text>

  <g fill="none" stroke="#9a9a90" stroke-width="1.25">
    <path d="M464 104H496" marker-end="url(#a)"/>
    <path d="M244 132V156" marker-end="url(#a)"/>
    <path d="M244 228V252" marker-end="url(#a)"/>
    <path d="M244 308V326H107V344" marker-end="url(#a)"/>
    <path d="M244 326H653V344" marker-end="url(#a)"/>
    <path d="M289 326V344" marker-end="url(#a)"/>
    <path d="M471 326V344" marker-end="url(#a)"/>
  </g>

  <!-- on the call -->
  <rect x="24" y="76" width="440" height="56" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
  <text x="40" y="100" font-weight="600" fill="#1f1f1f">1 · Agent books the slot on the call</text>
  <text x="40" y="116" font-size="11.5" fill="#5f5f5a">Scheduling API: POST /invitees with name, email, call_id</text>
  <text x="480" y="96" text-anchor="middle" font-size="11.5" fill="#5f5f5a">fails</text>
  <rect x="496" y="76" width="240" height="72" rx="8" fill="#fbecec" stroke="#c94040" stroke-width="2"/>
  <text x="512" y="100" font-weight="600" fill="#1f1f1f">Booking fails</text>
  <text x="512" y="116" font-size="11.5" fill="#1f1f1f">Slot taken or no email captured</text>
  <text x="512" y="132" font-size="11.5" fill="#1f1f1f">booking_pending + desk alert</text>

  <rect x="24" y="156" width="440" height="72" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"/>
  <text x="40" y="180" font-weight="600" fill="#1f1f1f">2 · Calendly confirms (automatic)</text>
  <text x="40" y="196" font-size="11.5" fill="#5f5f5a">Confirmation email + calendar invite</text>
  <text x="40" y="212" font-size="11.5" fill="#5f5f5a">to the caller and the designer, per event-type settings</text>

  <rect x="24" y="252" width="440" height="56" rx="8" fill="#e6eefb" stroke="#2f6fd1" stroke-width="2"/>
  <text x="40" y="276" font-weight="600" fill="#1f1f1f">3 · invitee.created webhook → our backend</text>
  <text x="40" y="292" font-size="11.5" fill="#1f1f1f">Matched to the call by utm_content = call_id</text>

  <!-- fan out -->
  <g fill="none" stroke="#9a9a90" stroke-width="1.25">
    <rect x="24" y="344" width="166" height="72" rx="8"/>
    <rect x="206" y="344" width="166" height="72" rx="8"/>
    <rect x="388" y="344" width="166" height="72" rx="8"/>
    <rect x="570" y="344" width="166" height="72" rx="8"/>
  </g>
  <text x="40" y="368" font-weight="600" fill="#1f1f1f">Supabase log</text>
  <text x="40" y="384" font-size="11.5" fill="#5f5f5a">status = booked</text>
  <text x="40" y="400" font-size="11.5" fill="#5f5f5a">slot, designer, links</text>
  <text x="222" y="368" font-weight="600" fill="#1f1f1f">Report card email</text>
  <text x="222" y="384" font-size="11.5" fill="#5f5f5a">to the designer</text>
  <text x="222" y="400" font-size="11.5" fill="#5f5f5a">includes the slot</text>
  <text x="404" y="368" font-weight="600" fill="#1f1f1f">HubSpot deal</text>
  <text x="404" y="384" font-size="11.5" fill="#5f5f5a">Stage: booked</text>
  <text x="404" y="400" font-size="11.5" fill="#5f5f5a">Amount left empty</text>
  <text x="586" y="368" font-weight="600" fill="#1f1f1f">Dashboard</text>
  <text x="586" y="384" font-size="11.5" fill="#5f5f5a">Bookings +1</text>
  <text x="586" y="400" font-size="11.5" fill="#5f5f5a">Call-to-booking time</text>

  <!-- later -->
  <rect x="16" y="440" width="728" height="124" rx="10" fill="#f6f6f3" stroke="#d6d6d0" stroke-width="1"/>
  <text x="32" y="462" font-size="11.5" font-weight="600" fill="#5f5f5a">LATER — from Calendly webhooks and HubSpot</text>
  <g fill="#ffffff" stroke="#9a9a90" stroke-width="1.25">
    <rect x="32" y="476" width="160" height="72" rx="8"/>
    <rect x="208" y="476" width="160" height="72" rx="8"/>
    <rect x="384" y="476" width="160" height="72" rx="8"/>
    <rect x="560" y="476" width="168" height="72" rx="8"/>
  </g>
  <text x="48" y="500" font-weight="600" fill="#1f1f1f">Cancelled</text>
  <text x="48" y="516" font-size="11.5" fill="#5f5f5a">status = cancelled</text>
  <text x="48" y="532" font-size="11.5" fill="#5f5f5a">Desk calls back</text>
  <text x="224" y="500" font-weight="600" fill="#1f1f1f">Rescheduled</text>
  <text x="224" y="516" font-size="11.5" fill="#5f5f5a">Slot updated</text>
  <text x="224" y="532" font-size="11.5" fill="#5f5f5a">Designer emailed</text>
  <text x="400" y="500" font-weight="600" fill="#1f1f1f">No-show marked</text>
  <text x="400" y="516" font-size="11.5" fill="#5f5f5a">status = no_show</text>
  <text x="400" y="532" font-size="11.5" fill="#5f5f5a">Desk follows up</text>
  <text x="576" y="500" font-weight="600" fill="#1f1f1f">Consultation held</text>
  <text x="576" y="516" font-size="11.5" fill="#5f5f5a">Designer marks deal</text>
  <text x="576" y="532" font-size="11.5" fill="#5f5f5a">won/lost in HubSpot</text>
</svg>
